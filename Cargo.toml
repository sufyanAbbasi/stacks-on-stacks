[package]
name = "stacks-on-stacks"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1.3"

[[bin]]
name = "stacks-on-stacks"
path = "src/simulation/main.rs"

